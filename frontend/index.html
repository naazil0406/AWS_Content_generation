<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Content Generation</title>
<style>
[hidden] { display: none !important; }

:root {
  --ink: #16211d;
  --ink-soft: #24352e;
  --paper: #f4efe1;
  --paper-raised: #fbf8ef;
  --paper-rule: #ddd3b4;
  --ink-text: #2b332f;
  --ink-text-soft: #5c6b63;
  --gold: #b8862b;
  --gold-deep: #93691d;
  --slate: #3e5c6b;
  --danger: #a3402f;
  --radius: 10px;
  --font-display: "Fraunces", serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink-text);
  font-family: var(--font-body);
}

button { font-family: inherit; cursor: pointer; }

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

.header { margin-bottom: 28px; }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin: 0 0 8px;
}

h1 {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 600;
  margin: 0 0 6px;
  color: var(--ink);
}

.sub { color: var(--ink-text-soft); font-size: 14.5px; margin: 0; }

.gen-trigger-row { display: flex; justify-content: flex-start; margin-bottom: 24px; }

.gen-panel {
  background: var(--paper-raised);
  border: 1px solid var(--paper-rule);
  border-radius: var(--radius);
  margin-bottom: 24px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  padding: 0 24px;
}
.gen-panel.open { max-height: 520px; opacity: 1; padding: 22px 24px 24px; }

.gen-panel-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.gen-panel-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--ink); margin: 0; }
.gen-panel-close { background: none; border: none; color: var(--ink-text-soft); font-size: 18px; line-height: 1; padding: 4px 6px; }
.gen-panel-close:hover { color: var(--ink); }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.field select, .field input, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--paper-rule);
  border-radius: 8px; background: #fff; color: var(--ink-text); font-family: inherit; font-size: 14px;
}
.field textarea { resize: vertical; min-height: 64px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 8px;
  padding: 11px 20px; font-size: 14px; font-weight: 600; background: var(--gold); color: #1b1406;
  transition: background 0.15s ease;
}
.btn:hover { background: var(--gold-deep); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.spinner {
  width: 14px; height: 14px; border: 2px solid rgba(27,20,6,0.35);
  border-top-color: #1b1406; border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.status { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-text-soft); margin-top: 10px; }
.status.error { color: var(--danger); }

.card {
  background: var(--paper-raised); border: 1px solid var(--paper-rule);
  border-radius: var(--radius); padding: 24px; margin-bottom: 24px;
}

.section-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }

.content-text {
  white-space: pre-wrap; line-height: 1.55; font-size: 15px;
  border-top: 1px solid var(--paper-rule); padding-top: 16px; margin-top: 12px;
}

.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-family: var(--font-mono); font-size: 11px; color: var(--slate); background: #e7eef1; padding: 3px 8px; border-radius: 999px; }

.images {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px;
}
@media (max-width: 700px) { .images { grid-template-columns: 1fr; } }

.image-card {
  border: 2px solid var(--paper-rule); border-radius: var(--radius); overflow: hidden; background: #fff; position: relative;
}
.image-card img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; }
.image-card-label {
  position: absolute; top: 8px; left: 8px; background: rgba(22,33,29,0.82); color: #f4efe1;
  font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 999px;
}
.image-card-download {
  display: block; text-align: center; padding: 8px; font-size: 12.5px; font-weight: 600;
  color: var(--gold-deep); border-top: 1px solid var(--paper-rule); text-decoration: none;
}
.image-card-download:hover { background: #f4efe1; }

/* Live-progress image frame (used by the streaming /generate/stream path
   while an individual image is still rendering) */
.image-frame {
  border: 2px dashed var(--paper-rule); border-radius: var(--radius); overflow: hidden;
  background: #fbf8ef; position: relative; aspect-ratio: 1 / 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
}
.image-frame.failed { border-color: var(--danger); background: #fbf1ee; }
.image-frame .frame-spinner {
  width: 26px; height: 26px; border: 3px solid rgba(184,134,43,0.25);
  border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
}
.image-frame .frame-status {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-text-soft); text-align: center; padding: 0 10px;
}
.image-frame .frame-status.failed { color: var(--danger); }

.timer-row {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
  font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-text-soft);
}
.timer-row .timer-value { font-weight: 600; }
.timer-row .timer-value.warn { color: var(--gold-deep); }
.timer-row .timer-value.over { color: var(--danger); }

.section-hint { margin-top: 16px; cursor: pointer; text-decoration: underline; font-size: 13px; color: var(--ink-text-soft); }
.prompt-text { font-size: 13px; color: var(--ink-text-soft); border-top: 1px solid var(--paper-rule); padding-top: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <p class="eyebrow">AI Content Generation</p>
    <h1>Generate learning content + images</h1>
    <p class="sub">Content Type + Topic in — original text and 3 image variations out.</p>
  </div>

  <div class="gen-trigger-row">
    <button class="btn" id="openGenBtn">+ Generate Content</button>
  </div>

  <div class="gen-panel" id="genPanel">
    <div class="gen-panel-header">
      <p class="gen-panel-title">New content generation</p>
      <button class="gen-panel-close" id="closeGenBtn" aria-label="Close">&times;</button>
    </div>

    <div class="field">
      <label for="contentType">Content Type</label>
      <select id="contentType"></select>
    </div>
    <div class="field">
      <label for="topic">Topic / Prompt</label>
      <textarea id="topic" placeholder="Describe what you want generated, e.g. 'Heat Safety Awareness for warehouse workers during summer months'"></textarea>
    </div>

    <button class="btn" id="generateBtn">Generate content + 3 images</button>
    <div class="timer-row" id="timerRow" hidden>
      Elapsed: <span class="timer-value" id="timerValue">0.0s</span> / target 60s
    </div>
    <div class="status" id="generateStatus"></div>
  </div>

  <div class="card" id="resultCard" hidden>
    <p class="section-title" id="resultTitle"></p>
    <div class="tags" id="resultTags"></div>
    <div class="content-text" id="contentText"></div>

    <div class="images" id="images"></div>

    <div class="section-hint" id="imagePromptToggle">Show image prompt ▾</div>
    <p class="prompt-text" id="imagePromptText" hidden></p>
  </div>

</div>

<script>
const API = "";

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const res = await fetch(API + path, Object.assign({}, options, { headers }));
  let body = null;
  try { body = await res.json(); } catch (_) { /* no body */ }
  if (!res.ok) {
    const detail = (body && body.detail) ? body.detail : res.statusText;
    const err = new Error(detail);
    err.status = res.status;
    err.retryAfter = parseInt(res.headers.get("Retry-After"), 10) || 20;
    throw err;
  }
  return body;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function setStatus(el, message, isError) {
  el.textContent = message || "";
  el.className = "status" + (isError ? " error" : "");
}

function openGenPanel() {
  document.getElementById("genPanel").classList.add("open");
  document.getElementById("topic").focus();
}

function closeGenPanel() {
  document.getElementById("genPanel").classList.remove("open");
}

async function loadContentTypes() {
  const select = document.getElementById("contentType");
  try {
    const data = await api("/api/content-types");
    select.innerHTML = (data.content_types || [])
      .map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`)
      .join("");
  } catch (err) {
    select.innerHTML = `<option value="">Could not load content types</option>`;
  }
}

// --- Live progress frames (streaming path — the only generation path now) ---
function renderImageFrames(count) {
  const wrap = document.getElementById("images");
  wrap.innerHTML = Array.from({ length: count }).map((_, i) => `
    <div class="image-frame" id="frame-${i}">
      <span class="image-card-label">Option ${i + 1}</span>
      <div class="frame-spinner"></div>
      <div class="frame-status" id="frame-status-${i}">Queued…</div>
    </div>
  `).join("");
}

function updateFrameStatus(index, status, detail) {
  const el = document.getElementById(`frame-status-${index}`);
  if (!el) return;
  const label = {
    submitted: "Submitted to image model…",
    polling: detail && detail.attempt
      ? `Rendering… attempt ${detail.attempt} (${detail.elapsed_seconds ?? "?"}s elapsed)`
      : "Rendering…",
    downloading: "Downloading finished image…",
  }[status] || status;
  el.textContent = label;
}

function markFrameReady(index, url) {
  const frame = document.getElementById(`frame-${index}`);
  if (!frame) return;
  frame.outerHTML = `
    <div class="image-card" id="frame-${index}">
      <span class="image-card-label">Option ${index + 1}</span>
      <img src="${url}" alt="Generated image ${index + 1}" />
      <a class="image-card-download" href="${url}" download="image-${index + 1}.png" target="_blank" rel="noopener">Download</a>
    </div>
  `;
}

function markFrameFailed(index, errorMessage) {
  const frame = document.getElementById(`frame-${index}`);
  if (!frame) return;
  frame.classList.add("failed");
  frame.innerHTML = `
    <span class="image-card-label">Option ${index + 1}</span>
    <div class="frame-status failed">Failed: ${escapeHtml(errorMessage || "unknown error")}</div>
  `;
}

// Parses a raw SSE text stream (fetch + ReadableStream, not the native
// EventSource — EventSource can't send a POST body, and this endpoint
// needs one) into { event, data } pairs. SSE frames are separated by a
// blank line; a frame can span multiple reads, so unparsed text is kept
// in `buffer` across calls.
function makeSseParser(onEvent) {
  let buffer = "";
  return function feed(chunkText) {
    buffer += chunkText;
    const frames = buffer.split("\n\n");
    buffer = frames.pop(); // last piece may be incomplete, keep it
    for (const frame of frames) {
      if (!frame.trim()) continue;
      let eventName = "message";
      let dataLine = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) eventName = line.slice(6).trim();
        else if (line.startsWith("data:")) dataLine += line.slice(5).trim();
      }
      let data = {};
      try { data = JSON.parse(dataLine); } catch (_) { /* ignore malformed frame */ }
      onEvent(eventName, data);
    }
  };
}

async function generateContentStreaming(contentType, topic, statusEl, timerValueEl) {
  const startedAt = performance.now();
  let timerHandle = null;
  const updateTimer = () => {
    const secs = (performance.now() - startedAt) / 1000;
    timerValueEl.textContent = `${secs.toFixed(1)}s`;
    timerValueEl.className = "timer-value" + (secs > 60 ? " over" : secs > 45 ? " warn" : "");
  };
  timerHandle = setInterval(updateTimer, 200);
  document.getElementById("timerRow").hidden = false;

  renderImageFrames(3); // default count — adjusted if content_ready implies otherwise
  document.getElementById("resultCard").hidden = false;
  document.getElementById("resultTitle").textContent = contentType;
  document.getElementById("contentText").textContent = "";
  document.getElementById("resultTags").innerHTML = "";

  try {
    const res = await fetch("/api/generate/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: topic, content_type: contentType }),
    });
    if (!res.ok || !res.body) {
      const body = await res.json().catch(() => null);
      throw new Error((body && body.detail) || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let finalPayload = null;
    let sawError = null;
    let contentReceived = false;

    const feed = makeSseParser((eventName, data) => {
      switch (eventName) {
        case "stage":
          setStatus(statusEl, data.stage === "retrieving_context"
            ? "Retrieving knowledge base context…"
            : "Generating content…");
          break;
        case "content_ready":
          contentReceived = true;
          document.getElementById("contentText").textContent = data.content_text;
          document.getElementById("resultTags").innerHTML = (data.tags || [])
            .map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
          document.getElementById("resultTitle").textContent =
            data.summary ? `${contentType}: ${data.summary}` : contentType;
          document.getElementById("imagePromptText").textContent = data.image_prompt || "";
          setStatus(statusEl, "Content ready — generating 3 image variations…");
          break;
        case "image_progress":
          updateFrameStatus(data.index, data.status, data.detail);
          break;
        case "image_ready":
          markFrameReady(data.index, data.url);
          break;
        case "image_failed":
          markFrameFailed(data.index, data.error);
          break;
        case "warning":
          setStatus(statusEl, data.message, false);
          break;
        case "done":
          finalPayload = data;
          break;
        case "error":
          sawError = data.message || "Unknown error";
          break;
      }
    });

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      feed(decoder.decode(value, { stream: true }));
    }

    if (sawError) {
      const err = new Error(sawError);
      err.earlyFailure = !contentReceived; // failed before any content streamed — safe to retry
      throw err;
    }
    const secs = (performance.now() - startedAt) / 1000;
    setStatus(statusEl, `Done in ${secs.toFixed(1)}s.`);
    closeGenPanel();
    document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    if (err.earlyFailure === undefined) err.earlyFailure = false; // e.g. fetch itself failed
    throw err;
  } finally {
    clearInterval(timerHandle);
  }
}

async function generateContent() {
  const contentType = document.getElementById("contentType").value;
  const topic = document.getElementById("topic").value.trim();
  const btn = document.getElementById("generateBtn");
  const statusEl = document.getElementById("generateStatus");

  if (!contentType) return setStatus(statusEl, "Choose a content type first.", true);
  if (!topic) return setStatus(statusEl, "Enter a topic first.", true);

  document.getElementById("resultCard").hidden = true;
  btn.disabled = true;

  // Knowledge base retrieval can occasionally fail early (e.g. Aurora
  // Serverless waking from an idle pause, ~15-30s) before any content
  // has streamed back — that's the only case worth auto-retrying,
  // since retrying after images have already started wastes the
  // work that succeeded. generateContentStreaming() throws with
  // `.earlyFailure = true` for exactly that case.
  const MAX_RETRIES = 2;
  let attempt = 0;
  while (true) {
    try {
      await generateContentStreaming(contentType, topic, statusEl, document.getElementById("timerValue"));
      break;
    } catch (err) {
      attempt += 1;
      if (err.earlyFailure && attempt <= MAX_RETRIES) {
        setStatus(statusEl, `Error: ${err.message} — retrying in 15s… (attempt ${attempt}/${MAX_RETRIES})`, true);
        await new Promise((r) => setTimeout(r, 15000));
        setStatus(statusEl, "Retrying…");
        continue;
      }
      setStatus(statusEl, `Error: ${err.message}`, true);
      break;
    }
  }
  btn.disabled = false;
}

document.getElementById("openGenBtn").addEventListener("click", openGenPanel);
document.getElementById("closeGenBtn").addEventListener("click", closeGenPanel);
document.getElementById("generateBtn").addEventListener("click", generateContent);
document.getElementById("imagePromptToggle").addEventListener("click", () => {
  const el = document.getElementById("imagePromptText");
  const toggle = document.getElementById("imagePromptToggle");
  el.hidden = !el.hidden;
  toggle.textContent = el.hidden ? "Show image prompt ▾" : "Hide image prompt ▴";
});

loadContentTypes();

// --- Aurora keep-alive ---
// Aurora Serverless auto-pauses after sitting idle, and waking it back
// up (15-30s) is too slow to fit inside API Gateway's hard 29-30s
// integration timeout — so a generate() request that lands right after
// a pause will fail (see api()'s 503/Retry-After handling above). This
// pings a lightweight backend endpoint every 4 minutes for as long as
// this tab stays open, keeping Aurora active during a real session.
// It's a no-op fire-and-forget call: failures are ignored here since
// generateContent() already handles a cold Aurora gracefully on its own.
// Note: this only helps while at least one tab is open somewhere — the
// very first request after an overnight/weekend gap with no open tabs
// can still hit a cold start.
const WARMUP_INTERVAL_MS = 4 * 60 * 1000;
function pingWarmup() {
  fetch(API + "/api/warmup").catch(() => {});
}
setInterval(pingWarmup, WARMUP_INTERVAL_MS);

</script>
</body>
</html>
