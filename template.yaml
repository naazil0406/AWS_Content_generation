AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI Content Generation Service — FastAPI on Lambda behind an HTTP API,
  via Mangum. Deploy with: sam build && sam deploy --guided

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  KnowledgeBaseId:
    Type: String
    Description: >
      ID of the existing Amazon Bedrock Knowledge Base (Bedrock console ->
      Knowledge Bases -> your KB -> Knowledge base overview). Not a URL.
  KnowledgeBaseRegion:
    Type: String
    Default: us-east-1
    Description: Region the Bedrock Knowledge Base lives in.
  ImageProvider:
    Type: String
    Default: freepik
    AllowedValues: [freepik, aws, pollinations]
  FreepikApiKey:
    Type: String
    NoEcho: true
    Default: ""
  # These were previously NOT wired into the Lambda's environment at
  # all — local .env could set them, but the deployed Lambda silently
  # always used config.py's Python defaults regardless of local config,
  # a real local/deployed divergence risk. Defaults here match config.py
  # exactly, so leaving all of these unset still deploys identically to
  # before; they're only useful if you want to override one without a
  # code change.
  FreepikModel:
    Type: String
    Default: ""
    Description: >
      Empty = Freepik's Mystic endpoint (default, slower ~90-130s). Set to
      one of flux-dev / hyperflux / seedream-v4 / seedream-v4-5 /
      seedream-v5-lite to use that model's own faster endpoint instead —
      see app/services/image_generation_service.py's _FLUX_ENDPOINTS.
  # NOTE: FreepikResolution / ImageWidth / ImageHeight used to live here
  # as deployment-wide CloudFormation Parameters — every request got
  # whatever the deployed stack was configured with, with no way for two
  # different requests to choose differently. They're now per-request
  # choices instead: GenerateContentRequest.image_aspect_ratio /
  # .image_resolution (see app/schemas/content.py and
  # app/routes/content.py's GET /image-settings) flow straight into
  # app/services/image_generation_service.py's get_image_gen_service()
  # for that one call only. config.py's IMAGE_WIDTH/IMAGE_HEIGHT/
  # FREEPIK_RESOLUTION Python defaults (1024/1024/"2k") are still the
  # SAFE DEFAULT used whenever a request omits one — see
  # get_image_gen_service()'s docstring — they just no longer come from
  # a deploy-time parameter here, so there's nothing left to fix for the
  # whole stack at once. If you need to change the safe default itself,
  # edit app/config.py directly (a code change, same as any other
  # default) rather than a deploy parameter.
  FreepikFilterNsfw:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Mystic-endpoint-only NSFW filter toggle (ignored by the Flux/Seedream endpoints above).
  # Fix for the 401/422 Freepik errors: observed in production, near-
  # simultaneous parallel image submissions from the same API key/plan
  # collided at Freepik's gateway, surfacing as DIFFERENT error codes
  # (401 on one request, 422 on another) for otherwise-identical
  # requests at the same millisecond — the signature of a race, not a
  # deterministic config problem. See
  # app/services/image_generation_service.py's _submit_with_retry() and
  # _submit_semaphore for the fix. Defaults below reproduce exactly what
  # ships even if you never touch these parameters.
  FreepikMaxConcurrentSubmissions:
    Type: Number
    Default: 1
    Description: Caps simultaneous Freepik submission POSTs per request's 3 images to avoid the gateway collision above. Only the fast submission step is capped — polling/download stay fully parallel.
  FreepikSubmitMaxRetries:
    Type: Number
    Default: 2
    Description: Extra attempts (beyond the first) for a failed Freepik submission — recovers from the collision above if it happens despite the concurrency cap.
  FreepikSubmitRetryBackoffSeconds:
    Type: Number
    Default: 0.75
    Description: Linear backoff between retry attempts (0.75s, 1.5s, ...).
  # These two were PREVIOUSLY NOT EXPOSED HERE AT ALL — only a Python
  # default in app/config.py (FREEPIK_POLL_TIMEOUT was 120.0, which sat
  # INSIDE Mystic's documented ~90-130s real-world latency range rather
  # than safely above it, causing legitimate successful renders to be
  # cut off and reported as failures). Now deploy-time tunable without a
  # code change.
  FreepikPollIntervalSeconds:
    Type: Number
    Default: 3
    Description: How often (seconds) the worker polls Freepik for task completion after submitting.
  FreepikPollTimeoutSeconds:
    Type: Number
    Default: 170
    Description: >
      Max seconds the worker waits for Freepik to finish rendering one
      image before giving up (raises a clean error, not a Lambda hard
      kill). Must stay comfortably BELOW ContentGenerationFunction's
      Timeout (below) to leave room for the submit step, image download,
      and S3 upload that happen after Freepik itself finishes — this
      value plus roughly 30-40s of margin is what that Timeout should be
      set to. 170s leaves real margin over Mystic's documented ~90-130s
      typical latency; the previous 120s default did not.
  # --- Image Generation Queue (SQS) ---
  # See ImageGenerationQueue/ImageGenerationDLQ below.
  # ContentGenerationFunction both SENDS to the queue (after its
  # existing, unchanged image-prompt-generation step) AND consumes from
  # it (via the ImageQueueEvent SQS event source on that same function
  # — see app/main.py's handler, which routes SQS-shaped invocations to
  # app/worker.py instead of through Mangum/FastAPI). There is no
  # separate worker Lambda — merged into one function by explicit
  # choice; content generation itself still never touches SQS.
  ImageWorkerReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Max simultaneous ContentGenerationFunction invocations across ALL
      requests/users combined, covering BOTH API-serving traffic AND
      SQS-triggered image jobs together (they're the same function post-
      merge) — this is now the real lever for "how many requests hit
      Freepik at once," but setting it also caps total API throughput,
      not just image generation. Default -1 means "no reservation" (this
      Parameter's value is ignored via the HasReservedConcurrency
      Condition below, and ReservedConcurrentExecutions is omitted
      entirely), preserving this function's original unconstrained API
      behavior. Set to a non-negative number to opt into a hard cap —
      with BatchSize 1 (one image per invocation) on the image side,
      that number becomes the system-wide concurrent-Freepik-calls
      ceiling too. Independent from FreepikMaxConcurrentSubmissions
      above, which only throttles the fast SUBMIT step within a single
      invocation (now always 1 image per invocation, so that cap is
      effectively moot here). Must stay within your account's Lambda
      concurrency limit (default 1000) or the deploy fails.
  ImageQueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 1260
    Description: >
      Must exceed ContentGenerationFunction's own Timeout (below,
      overridden to 210 to cover SQS-triggered image jobs: 170s Freepik
      poll timeout + ~40s margin for the submit step, image download,
      and S3 upload) with margin — otherwise SQS could redeliver a
      message to a second invocation while the first is still
      legitimately running, causing the same image to render twice.
      AWS's own guidance is >=6x the function timeout; 1260s (21 min) is
      exactly 6x a 210s timeout (the previous 900s default was only ~5x
      the previous 180s timeout, short of that guidance — corrected
      here alongside the timeout increase below).
  ImageQueueMaxReceiveCount:
    Type: Number
    Default: 3
    Description: >
      How many times SQS redelivers a failing message to
      ContentGenerationFunction (via its ImageQueueEvent SQS trigger)
      before giving up and routing it to ImageGenerationDLQ instead.
      Below this count, a transient Freepik error just gets a free
      automatic retry; at/above it, the job stops being retried and
      needs manual attention (inspect ImageGenerationDLQ) — this is the
      queue's OWN built-in retry mechanism, not an application-level one.
  DeploymentPreferenceType:
    Type: String
    Default: Canary10Percent5Minutes
    AllowedValues:
      - AllAtOnce
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Canary10Percent15Minutes
      - Canary10Percent30Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
      - Linear10PercentEvery3Minutes
      - Linear10PercentEvery10Minutes
    Description: >
      How the "prod" alias shifts traffic to each new Lambda version.
      AllAtOnce = simple immediate cutover (Section A: version + alias,
      no traffic shifting). Canary/Linear = SAM/CodeDeploy shifts a small
      percentage of traffic first, watches ProdAliasErrorAlarm below, and
      automatically shifts prod back to the previous version if it fires
      before completing the rollout (Section B). Default recommended:
      Canary10Percent5Minutes — see README's "Lambda Versioning &
      Rollback" section for the full A-vs-B rationale.

Conditions:
  # -1 (ImageWorkerReservedConcurrency's default) means "don't set
  # ReservedConcurrentExecutions at all" — CloudFormation has no concept
  # of "unset" for a Number parameter, so -1 is used as the sentinel and
  # this Condition + the Fn::If on ContentGenerationFunction's
  # ReservedConcurrentExecutions property (below) turn that sentinel
  # into actually omitting the property (via !Ref AWS::NoValue) rather
  # than passing -1 through to Lambda, which would be a real (invalid)
  # value.
  HasReservedConcurrency: !Not [!Equals [!Ref ImageWorkerReservedConcurrency, -1]]

Resources:
  ContentGenerationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  # Name for the S3 bucket that stores generated images. Must be
  # globally unique across all AWS accounts.
  GeneratedImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedImages
            Status: Enabled
            ExpirationInDays: 1   # presigned URLs only last S3_PRESIGNED_URL_EXPIRY seconds anyway

  # Dead-letter queue for ImageGenerationQueue below — a message lands
  # here only after ContentGenerationFunction (via its ImageQueueEvent
  # SQS trigger) has failed to process it
  # ImageQueueMaxReceiveCount times. Nothing consumes this
  # automatically (no DynamoDB/job-tracking/alerting was added per the
  # explicit scope of this feature) — it exists purely so failed jobs
  # aren't silently retried forever or silently dropped; inspect it
  # manually (or point your own external tooling at it) to find and
  # re-drive/investigate failed image jobs.
  #
  # QueueName is explicit (not left to CloudFormation's auto-generated
  # "{stack-name}-ImageGenerationDLQ-XXXXX" default) purely so the AWS
  # Console/CLI show the exact name "ImageGenerationDLQ" rather than a
  # generated string — the application never reads this name (it only
  # ever uses the Queue URL/ARN, both unaffected by this). Trade-off:
  # an explicit name is a physical resource name, so it must be unique
  # per AWS account+region — you can only deploy ONE stack using this
  # template into a given account+region at a time (e.g. this rules out
  # separate "staging" and "prod" stacks in the same account+region
  # unless you either override this Parameter's default per-environment
  # or drop back to the auto-generated name). Not an issue for a single
  # deployment target.
  ImageGenerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ImageGenerationDLQ
      MessageRetentionPeriod: 1209600   # 14 days (SQS max) — generous window to notice and act on failures

  # One message per requested image (see app/routes/content.py's
  # _enqueue_image_jobs(), called only from the generate_images=True
  # branch of /generate and /generate/stream, AFTER the existing
  # image-prompt-generation step has already produced the prompts).
  # ContentGenerationFunction (via its ImageQueueEvent SQS trigger — see
  # that resource's Events block) is the sole consumer; there is no
  # separate worker Lambda.
  #
  # QueueName explicit for the same reason as ImageGenerationDLQ above
  # — same per-account+region uniqueness trade-off applies here too.
  ImageGenerationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ImageGenerationQueue
      VisibilityTimeout: !Ref ImageQueueVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageGenerationDLQ.Arn
        maxReceiveCount: !Ref ImageQueueMaxReceiveCount

  # Watched by DeploymentPreference below during a canary/linear rollout.
  # If invocations of the "prod" alias error out while a canary/linear
  # deployment is shifting traffic to a new version, CodeDeploy
  # automatically shifts the "prod" alias back to the previous version —
  # no manual action, no rebuild. Scoped to the alias (Resource:
  # <function>:prod), not the whole function, so it only reflects
  # traffic actually going through "prod".
  ProdAliasErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Lambda Errors > 0 for the content_generation function's "prod"
        alias — triggers CodeDeploy's automatic rollback of the "prod"
        alias while a canary/linear deployment is in progress.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ContentGenerationFunction
        - Name: Resource
          Value: !Sub "${ContentGenerationFunction}:prod"

  ContentGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content_generation
      Handler: app.main.handler
      CodeUri: .
      # Overrides Globals.Function.Timeout (120) — this function now
      # ALSO handles SQS-triggered image-generation invocations (see
      # app/main.py's handler and app/worker.py). 210s = 170s
      # FreepikPollTimeoutSeconds (below) + ~40s margin for the submit
      # step, image download, and S3 upload that happen after Freepik
      # itself finishes. Was 180s with a 120s poll timeout — that only
      # left 60s of margin but, more importantly, 120s sat INSIDE
      # Mystic's documented ~90-130s real-world latency range rather
      # than safely above it, so a meaningful share of legitimate,
      # successful renders were being cut off by the POLL timeout
      # (raising a clean error well before this Lambda Timeout was ever
      # reached) and reported as failures. API Gateway HTTP API itself
      # caps integration wait time at ~30s regardless of this value, so
      # this only actually extends how long an SQS-triggered invocation
      # of this SAME function is allowed to run — the API path's
      # effective ceiling is unchanged.
      Timeout: 210
      # See ImageWorkerReservedConcurrency's description in Parameters
      # above for what this now covers post-merge: BOTH API-serving
      # traffic and SQS-triggered image jobs share this one pool, since
      # they're the same function. Defaults to -1 (no reservation, i.e.
      # unbounded up to your account's concurrency limit) to preserve
      # this function's original unconstrained API behavior — set it
      # explicitly if you want a hard cap protecting Freepik, understanding
      # that the same cap also then limits total API throughput.
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ImageWorkerReservedConcurrency, !Ref "AWS::NoValue"]
      # Every `sam deploy` that changes code or configuration now
      # publishes a new IMMUTABLE Lambda version (1, 2, 3, ...) and keeps
      # the "prod" alias — not $LATEST — as the stable pointer production
      # traffic actually uses. SAM automatically repoints the existing
      # ApiEvent/RootEvent integrations below at
      # "content_generation:prod" instead of the bare function/$LATEST,
      # and manages the matching Lambda resource-based invoke permission
      # for API Gateway — no manual Api/integration changes needed, and
      # the existing API Gateway URL/routes/CORS are unaffected. SAM also
      # points the new ImageQueueEvent's event source mapping (below) at
      # this same "prod" alias, so an in-progress canary/linear rollout
      # applies consistently to both triggers of this one function.
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
        Alarms:
          - !Ref ProdAliasErrorAlarm
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          KNOWLEDGE_BASE_REGION: !Ref KnowledgeBaseRegion
          IMAGE_PROVIDER: !Ref ImageProvider
          FREEPIK_API_KEY: !Ref FreepikApiKey
          FREEPIK_MODEL: !Ref FreepikModel
          FREEPIK_FILTER_NSFW: !Ref FreepikFilterNsfw
          FREEPIK_MAX_CONCURRENT_SUBMISSIONS: !Ref FreepikMaxConcurrentSubmissions
          FREEPIK_SUBMIT_MAX_RETRIES: !Ref FreepikSubmitMaxRetries
          FREEPIK_SUBMIT_RETRY_BACKOFF_SECONDS: !Ref FreepikSubmitRetryBackoffSeconds
          # Previously NOT SET HERE AT ALL — only a Python default in
          # config.py, meaning no deployment could tune it without a
          # code change. See FreepikPollTimeoutSeconds's description in
          # Parameters above for why the default itself also changed.
          FREEPIK_POLL_INTERVAL: !Ref FreepikPollIntervalSeconds
          FREEPIK_POLL_TIMEOUT: !Ref FreepikPollTimeoutSeconds
          GENERATED_IMAGES_BUCKET: !Ref GeneratedImagesBucket
          # Used both to SEND (app/routes/content.py's
          # _enqueue_image_jobs(), from the API-serving side of this
          # function) and, indirectly, to RECEIVE (the ImageQueueEvent
          # source mapping below feeds SQS-shaped events into this same
          # function's app.main.handler, which routes them to
          # app/worker.py — that path never reads this URL directly,
          # it just processes whatever record SQS already delivered).
          IMAGE_QUEUE_URL: !Ref ImageGenerationQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${GeneratedImagesBucket.Arn}/*"
            - Effect: Allow
              # SendMessage for the API-serving side (queuing new image
              # jobs); Receive/Delete/GetQueueAttributes for the
              # SQS-triggered side are auto-granted by the ImageQueueEvent
              # source below (SAM's Type: SQS event) — not duplicated here.
              Action:
                - sqs:SendMessage
              Resource: !GetAtt ImageGenerationQueue.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          # /{proxy+} does not match the bare root path — this catches
          # GET / so the bundled frontend/index.html is served there.
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /
            Method: GET
        # Merged onto this SAME function (not a separate
        # a separate ImageWorkerFunction — see app/main.py's handler docstring for
        # why and the concurrency trade-off this implies). SQS-shaped
        # invocations get routed by app/main.py's handler to
        # app/worker.py instead of through Mangum/FastAPI.
        #
        # Named ImageQueueEventV2 (not ImageQueueEvent) DELIBERATELY —
        # this is a rename, not just a version bump. Renaming a nested
        # resource's logical ID forces CloudFormation to treat it as an
        # entirely new resource: DELETE the old EventSourceMapping
        # (logical ID ImageQueueEvent) and CREATE a brand new one fresh,
        # bound to whatever ImageGenerationQueue.Arn and the "prod" alias
        # actually resolve to AT THIS DEPLOY. This was done to eliminate
        # a real, confirmed-in-production mystery: CloudFormation
        # reported the OLD EventSourceMapping as CREATE_COMPLETE /
        # UPDATE_COMPLETE, yet the queue's own "Lambda triggers" tab
        # showed no consumer and the worker never actually ran for any
        # queued job (verified via CloudWatch Logs — zero matches for a
        # real request_id across every log stream). The most likely
        # explanation is a stale binding left over from the queue being
        # replaced earlier when QueueName was added (SQS queue rename ->
        # new physical ARN) and/or the ImageWorkerFunction -> merged-
        # into-ContentGenerationFunction transition — either way, this
        # forces a guaranteed-clean rebind in a single deploy rather than
        # requiring more AWS-console archaeology to find which exact
        # historical deploy left it stale. If you ever need to do this
        # again for the same reason, bump the suffix again (V3, V4, ...).
        ImageQueueEventV2:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageGenerationQueue.Arn
            # Each image is an independent generation job with its own
            # Freepik call and S3 write — batching multiple images into
            # one invocation would mean one slow/failing image blocks or
            # fails the others for no reason. SAM's SQS event type
            # automatically grants this function
            # sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes on the
            # queue — no separate Policies entry needed for that (the
            # explicit sqs:SendMessage statement above is still needed;
            # that one isn't auto-granted by this event).
            BatchSize: 1

Outputs:
  ApiUrl:
    Description: Invoke URL for the Content Generation API
    Value: !Sub "https://${ContentGenerationApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Value: !GetAtt ContentGenerationFunction.Arn
  FunctionName:
    Description: The Lambda function's actual name in AWS
    Value: !Ref ContentGenerationFunction
  ProdAliasArn:
    Description: >
      The stable "prod" alias ARN — this, not the bare FunctionArn above,
      is what API Gateway actually invokes. Use with `aws lambda
      update-alias` for manual rollback (see README's Rollback section).
    Value: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ContentGenerationFunction}:prod"
  GeneratedImagesBucketName:
    Description: S3 bucket storing generated images
    Value: !Ref GeneratedImagesBucket
  ImageGenerationQueueUrl:
    Description: SQS queue URL for image-generation jobs
    Value: !Ref ImageGenerationQueue
  ImageGenerationQueueArn:
    Value: !GetAtt ImageGenerationQueue.Arn
  ImageGenerationDLQUrl:
    Description: Dead-letter queue — inspect for image jobs that failed maxReceiveCount times
    Value: !Ref ImageGenerationDLQ