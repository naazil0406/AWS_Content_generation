AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI Content Generation Service — FastAPI on Lambda behind an HTTP API,
  via Mangum. Deploy with: sam build && sam deploy --guided

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  KnowledgeBaseId:
    Type: String
    Description: >
      ID of the existing Amazon Bedrock Knowledge Base (Bedrock console ->
      Knowledge Bases -> your KB -> Knowledge base overview). Not a URL.
  KnowledgeBaseRegion:
    Type: String
    Default: us-east-1
    Description: Region the Bedrock Knowledge Base lives in.
  LlmProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, openrouter]
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Default: ""
  ImageProvider:
    Type: String
    Default: aws
    AllowedValues: [aws, huggingface, pollinations, freepik]
  HfToken:
    Type: String
    NoEcho: true
    Default: ""
  FreepikApiKey:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  ContentGenerationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  ContentGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content_generation
      Handler: app.main.handler
      CodeUri: .
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          KNOWLEDGE_BASE_REGION: !Ref KnowledgeBaseRegion
          LLM_PROVIDER: !Ref LlmProvider
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          IMAGE_PROVIDER: !Ref ImageProvider
          HF_TOKEN: !Ref HfToken
          FREEPIK_API_KEY: !Ref FreepikApiKey
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          # /{proxy+} does not match the bare root path — this catches
          # GET / so the bundled frontend/index.html is served there.
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /
            Method: GET

Outputs:
  ApiUrl:
    Description: Invoke URL for the Content Generation API
    Value: !Sub "https://${ContentGenerationApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Value: !GetAtt ContentGenerationFunction.Arn
  FunctionName:
    Description: The Lambda function's actual name in AWS
    Value: !Ref ContentGenerationFunction