AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI Content Generation Service — FastAPI on Lambda behind an HTTP API,
  via Mangum. Deploy with: sam build && sam deploy --guided

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  KnowledgeBaseId:
    Type: String
    Description: >
      ID of the existing Amazon Bedrock Knowledge Base (Bedrock console ->
      Knowledge Bases -> your KB -> Knowledge base overview). Not a URL.
  KnowledgeBaseRegion:
    Type: String
    Default: us-east-1
    Description: Region the Bedrock Knowledge Base lives in.
  ImageProvider:
    Type: String
    Default: freepik
    AllowedValues: [freepik, aws, pollinations]
  FreepikApiKey:
    Type: String
    NoEcho: true
    Default: ""
  # These were previously NOT wired into the Lambda's environment at
  # all — local .env could set them, but the deployed Lambda silently
  # always used config.py's Python defaults regardless of local config,
  # a real local/deployed divergence risk. Defaults here match config.py
  # exactly, so leaving all of these unset still deploys identically to
  # before; they're only useful if you want to override one without a
  # code change.
  FreepikModel:
    Type: String
    Default: ""
    Description: >
      Empty = Freepik's Mystic endpoint (default, slower ~90-130s). Set to
      one of flux-dev / hyperflux / seedream-v4 / seedream-v4-5 /
      seedream-v5-lite to use that model's own faster endpoint instead —
      see app/services/image_generation_service.py's _FLUX_ENDPOINTS.
  # NOTE: FreepikResolution / ImageWidth / ImageHeight used to live here
  # as deployment-wide CloudFormation Parameters — every request got
  # whatever the deployed stack was configured with, with no way for two
  # different requests to choose differently. They're now per-request
  # choices instead: GenerateContentRequest.image_aspect_ratio /
  # .image_resolution (see app/schemas/content.py and
  # app/routes/content.py's GET /image-settings) flow straight into
  # app/services/image_generation_service.py's get_image_gen_service()
  # for that one call only. config.py's IMAGE_WIDTH/IMAGE_HEIGHT/
  # FREEPIK_RESOLUTION Python defaults (1024/1024/"2k") are still the
  # SAFE DEFAULT used whenever a request omits one — see
  # get_image_gen_service()'s docstring — they just no longer come from
  # a deploy-time parameter here, so there's nothing left to fix for the
  # whole stack at once. If you need to change the safe default itself,
  # edit app/config.py directly (a code change, same as any other
  # default) rather than a deploy parameter.
  FreepikFilterNsfw:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Mystic-endpoint-only NSFW filter toggle (ignored by the Flux/Seedream endpoints above).
  # Fix for the 401/422 Freepik errors: observed in production, near-
  # simultaneous parallel image submissions from the same API key/plan
  # collided at Freepik's gateway, surfacing as DIFFERENT error codes
  # (401 on one request, 422 on another) for otherwise-identical
  # requests at the same millisecond — the signature of a race, not a
  # deterministic config problem. See
  # app/services/image_generation_service.py's _submit_with_retry() and
  # _submit_semaphore for the fix. Defaults below reproduce exactly what
  # ships even if you never touch these parameters.
  FreepikMaxConcurrentSubmissions:
    Type: Number
    Default: 1
    Description: Caps simultaneous Freepik submission POSTs per request's 3 images to avoid the gateway collision above. Only the fast submission step is capped — polling/download stay fully parallel.
  FreepikSubmitMaxRetries:
    Type: Number
    Default: 2
    Description: Extra attempts (beyond the first) for a failed Freepik submission — recovers from the collision above if it happens despite the concurrency cap.
  FreepikSubmitRetryBackoffSeconds:
    Type: Number
    Default: 0.75
    Description: Linear backoff between retry attempts (0.75s, 1.5s, ...).
  # These two were PREVIOUSLY NOT EXPOSED HERE AT ALL — only a Python
  # default in app/config.py (FREEPIK_POLL_TIMEOUT was 120.0, which sat
  # INSIDE Mystic's documented ~90-130s real-world latency range rather
  # than safely above it, causing legitimate successful renders to be
  # cut off and reported as failures). Now deploy-time tunable without a
  # code change.
  FreepikPollIntervalSeconds:
    Type: Number
    Default: 3
    Description: How often (seconds) the worker polls Freepik for task completion after submitting.
  FreepikPollTimeoutSeconds:
    Type: Number
    Default: 170
    Description: >
      Max seconds the worker waits for Freepik to finish rendering one
      image before giving up (raises a clean error, not a Lambda hard
      kill). Must stay comfortably BELOW ContentGenerationFunction's
      Timeout (below) to leave room for the submit step, image download,
      and S3 upload that happen after Freepik itself finishes — this
      value plus roughly 30-40s of margin is what that Timeout should be
      set to. 170s leaves real margin over Mystic's documented ~90-130s
      typical latency; the previous 120s default did not.
  # --- Image Generation Queue (SQS) — only used for 2-3 image requests ---
  # ContentGenerationFunction both SENDS to this queue (after its
  # existing, unchanged image-prompt-generation step, when image_count
  # is 2 or 3) AND consumes from it (via its own ImageQueueEvent SQS
  # trigger — see that resource's Events block). There is no separate
  # worker Lambda; a 1-image request never touches this queue at all.
  ImageQueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 1260
    Description: >
      Must exceed ContentGenerationFunction's own Timeout (below) with
      margin — otherwise SQS could redeliver a message to a second
      invocation while the first is still legitimately running, causing
      the same image to render twice. AWS's own guidance is >=6x the
      function timeout; 1260s (21 min) is exactly 6x a 210s timeout.
  ImageQueueMaxReceiveCount:
    Type: Number
    Default: 3
    Description: >
      How many times SQS redelivers a failing message to
      ContentGenerationFunction (via its ImageQueueEvent SQS trigger)
      before giving up and routing it to ImageGenerationDLQ instead.
      This is the queue's OWN built-in retry mechanism, not an
      application-level one.
  ImageQueueMaximumConcurrency:
    Type: Number
    Default: 6
    Description: >
      Max simultaneous Lambda invocations triggered BY THIS QUEUE
      specifically — this is the real "how many requests hit Freepik at
      once, safely" control, and it is deliberately scoped to the queue
      alone (via the SQS event source's own ScalingConfig), NOT to
      ContentGenerationFunction's overall concurrency. That means image
      jobs queueing up under load can never throttle or compete with
      normal API-serving traffic — the two are independent pools. AWS
      requires this value to be between 2 and 1000 for SQS event
      sources. 6 is a starting point sized for typical shared-account
      Lambda concurrency limits (default 1000 account-wide) — raise it
      if you expect sustained high multi-image traffic.
  DeploymentPreferenceType:
    Type: String
    Default: Canary10Percent5Minutes
    AllowedValues:
      - AllAtOnce
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Canary10Percent15Minutes
      - Canary10Percent30Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
      - Linear10PercentEvery3Minutes
      - Linear10PercentEvery10Minutes
    Description: >
      How the "prod" alias shifts traffic to each new Lambda version.
      AllAtOnce = simple immediate cutover (Section A: version + alias,
      no traffic shifting). Canary/Linear = SAM/CodeDeploy shifts a small
      percentage of traffic first, watches ProdAliasErrorAlarm below, and
      automatically shifts prod back to the previous version if it fires
      before completing the rollout (Section B). Default recommended:
      Canary10Percent5Minutes — see README's "Lambda Versioning &
      Rollback" section for the full A-vs-B rationale.

Resources:
  ContentGenerationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  # Name for the S3 bucket that stores generated images. Must be
  # globally unique across all AWS accounts.
  GeneratedImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedImages
            Status: Enabled
            ExpirationInDays: 1   # presigned URLs only last S3_PRESIGNED_URL_EXPIRY seconds anyway

  # Dead-letter queue for ImageGenerationQueue below — a message lands
  # here only after ContentGenerationFunction (via its ImageQueueEvent
  # SQS trigger) has failed to process it ImageQueueMaxReceiveCount
  # times. Nothing consumes this automatically (no DynamoDB/job-tracking/
  # alerting was added, per explicit scope) — it exists purely so failed
  # jobs aren't silently retried forever or silently dropped; inspect it
  # manually to find and investigate failed image jobs.
  ImageGenerationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ImageGenerationDLQ
      MessageRetentionPeriod: 1209600   # 14 days (SQS max)

  # Only used for 2- or 3-image requests (see app/routes/content.py's
  # _enqueue_image_jobs() — a 1-image request always renders inline and
  # never touches this queue). One message per requested image, each
  # already carrying its fully-generated image_prompt.
  # ContentGenerationFunction (the SAME Lambda that serves API Gateway —
  # see its ImageQueueEvent SQS trigger in its Events block) is the sole
  # consumer. There is NO separate worker Lambda.
  #
  # Logical ID is ImageGenerationQueueV3 (bumped again from V2) —
  # deliberately, not a typo, and not just cosmetic. Each rename forces
  # CloudFormation to treat this as a brand-new resource to CREATE from
  # scratch rather than reconcile against a stale tracked reference —
  # same technique used for the stuck EventSourceMapping earlier.
  #
  # IMPORTANT — this rename alone is NOT sufficient this time: unlike
  # the V1->V2 rename (where the physical queue was simply gone and the
  # name was free), a queue named "ImageGenerationQueue" and a DLQ named
  # "ImageGenerationDLQ" were manually created via the AWS CLI as a
  # stopgap (along with a manually-created EventSourceMapping directly
  # attached to the Lambda, bypassing CloudFormation entirely). SQS
  # queue names must be unique per account+region — CloudFormation's
  # CREATE for a queue with the SAME physical QueueName will fail with
  # "QueueAlreadyExists" if those manually-created resources still
  # exist when this deploys. Before deploying this template:
  #   1. Delete the manually-created EventSourceMapping:
  #      aws lambda delete-event-source-mapping --uuid <uuid>
  #   2. Delete both manually-created queues:
  #      aws sqs delete-queue --queue-url <ImageGenerationQueue URL>
  #      aws sqs delete-queue --queue-url <ImageGenerationDLQ URL>
  #   3. (Optional cleanup) Remove the manual IAM inline policy added
  #      earlier: aws iam delete-role-policy --role-name <role>
  #      --policy-name ManualImageQueueConsumePolicy — CloudFormation's
  #      own Policies below already grant what's needed; the manual one
  #      becomes redundant once this deploys successfully.
  # Only THEN will CloudFormation's CREATE for both queues under this
  # new logical ID succeed cleanly. QueueName itself is unchanged —
  # "ImageGenerationQueue" is still the physical name once recreated.
  ImageGenerationQueueV3:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ImageGenerationQueue
      VisibilityTimeout: !Ref ImageQueueVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageGenerationDLQ.Arn
        maxReceiveCount: !Ref ImageQueueMaxReceiveCount

  # Watched by DeploymentPreference below during a canary/linear rollout.
  # If invocations of the "prod" alias error out while a canary/linear
  # deployment is shifting traffic to a new version, CodeDeploy
  # automatically shifts the "prod" alias back to the previous version —
  # no manual action, no rebuild. Scoped to the alias (Resource:
  # <function>:prod), not the whole function, so it only reflects
  # traffic actually going through "prod".
  ProdAliasErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Lambda Errors > 0 for the content_generation function's "prod"
        alias — triggers CodeDeploy's automatic rollback of the "prod"
        alias while a canary/linear deployment is in progress.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ContentGenerationFunction
        - Name: Resource
          Value: !Sub "${ContentGenerationFunction}:prod"

  ContentGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content_generation
      Handler: app.main.handler
      CodeUri: .
      # Overrides Globals.Function.Timeout (120) — this function now
      # ALSO handles SQS-triggered image jobs for 2-3 image requests
      # (see app/main.py's handler and app/image_worker.py). 210s =
      # 170s FreepikPollTimeoutSeconds + ~40s margin for the submit
      # step, image download, and S3 upload that happen after Freepik
      # itself finishes. API Gateway HTTP API itself caps integration
      # wait time at ~30s regardless of this value, so this only
      # actually extends how long an SQS-triggered invocation of this
      # SAME function is allowed to run — the API path's effective
      # ceiling (and the 1-image synchronous path, which returns well
      # under 30s in practice) is unchanged.
      Timeout: 210
      # Every `sam deploy` that changes code or configuration now
      # publishes a new IMMUTABLE Lambda version (1, 2, 3, ...) and keeps
      # the "prod" alias — not $LATEST — as the stable pointer production
      # traffic actually uses. SAM automatically repoints the existing
      # ApiEvent/RootEvent integrations below at
      # "content_generation:prod" instead of the bare function/$LATEST,
      # and manages the matching Lambda resource-based invoke permission
      # for API Gateway — no manual Api/integration changes needed, and
      # the existing API Gateway URL/routes/CORS are unaffected. SAM
      # also points the new ImageQueueEvent's event source mapping
      # (below) at this same "prod" alias.
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
        Alarms:
          - !Ref ProdAliasErrorAlarm
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          KNOWLEDGE_BASE_REGION: !Ref KnowledgeBaseRegion
          IMAGE_PROVIDER: !Ref ImageProvider
          FREEPIK_API_KEY: !Ref FreepikApiKey
          FREEPIK_MODEL: !Ref FreepikModel
          FREEPIK_FILTER_NSFW: !Ref FreepikFilterNsfw
          FREEPIK_MAX_CONCURRENT_SUBMISSIONS: !Ref FreepikMaxConcurrentSubmissions
          FREEPIK_SUBMIT_MAX_RETRIES: !Ref FreepikSubmitMaxRetries
          FREEPIK_SUBMIT_RETRY_BACKOFF_SECONDS: !Ref FreepikSubmitRetryBackoffSeconds
          # Previously NOT SET HERE AT ALL — only a Python default in
          # config.py, meaning no deployment could tune it without a
          # code change. See FreepikPollTimeoutSeconds's description in
          # Parameters above for why the default itself also changed.
          FREEPIK_POLL_INTERVAL: !Ref FreepikPollIntervalSeconds
          FREEPIK_POLL_TIMEOUT: !Ref FreepikPollTimeoutSeconds
          GENERATED_IMAGES_BUCKET: !Ref GeneratedImagesBucket
          # Used both to SEND (app/routes/content.py's
          # _enqueue_image_jobs(), for 2-3 image requests only, from the
          # API-serving side of this function) and, indirectly, to
          # RECEIVE (the ImageQueueEvent source mapping below feeds
          # SQS-shaped events into this same function's app.main.handler,
          # which routes them to app/image_worker.py — that path never
          # reads this URL directly, it just processes whatever record
          # SQS already delivered).
          IMAGE_QUEUE_URL: !Ref ImageGenerationQueueV3
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${GeneratedImagesBucket.Arn}/*"
            - Effect: Allow
              # SendMessage for the API-serving side (queuing 2-3 image
              # jobs); Receive/Delete/GetQueueAttributes for the
              # SQS-triggered side are auto-granted by the ImageQueueEvent
              # source below (SAM's Type: SQS event) — not duplicated here.
              Action:
                - sqs:SendMessage
              Resource: !GetAtt ImageGenerationQueueV3.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          # /{proxy+} does not match the bare root path — this catches
          # GET / so the bundled frontend/index.html is served there.
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /
            Method: GET
        # Fires ONLY for 2-3 image requests (see
        # app/routes/content.py's _SQS_IMAGE_COUNT_THRESHOLD) — this is
        # the SAME Lambda that serves API Gateway, not a separate
        # function; SQS-shaped invocations get routed by
        # app/main.py's handler to app/image_worker.py instead of
        # through Mangum/FastAPI.
        ImageQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageGenerationQueueV3.Arn
            # Each image is an independent generation job with its own
            # Freepik call and S3 write — batching multiple images into
            # one invocation would mean one slow/failing image blocks or
            # fails the others for no reason. SAM's SQS event type
            # automatically grants this function
            # sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes on the
            # queue — no separate Policies entry needed for that (the
            # explicit sqs:SendMessage statement above is still needed;
            # that one isn't auto-granted by this event).
            BatchSize: 1
            # This is what actually lets multiple queued image jobs
            # invoke this SAME function concurrently rather than one
            # after another, WITHOUT touching the function's overall
            # concurrency (unlike an earlier version of this
            # architecture, which used ReservedConcurrentExecutions on
            # the whole function and therefore also throttled normal API
            # traffic). This cap applies only to invocations triggered
            # BY THIS QUEUE.
            ScalingConfig:
              MaximumConcurrency: !Ref ImageQueueMaximumConcurrency

Outputs:
  ApiUrl:
    Description: Invoke URL for the Content Generation API
    Value: !Sub "https://${ContentGenerationApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Value: !GetAtt ContentGenerationFunction.Arn
  FunctionName:
    Description: The Lambda function's actual name in AWS
    Value: !Ref ContentGenerationFunction
  ProdAliasArn:
    Description: >
      The stable "prod" alias ARN — this, not the bare FunctionArn above,
      is what API Gateway actually invokes. Use with `aws lambda
      update-alias` for manual rollback (see README's Rollback section).
    Value: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ContentGenerationFunction}:prod"
  GeneratedImagesBucketName:
    Description: S3 bucket storing generated images
    Value: !Ref GeneratedImagesBucket
  ImageGenerationQueueUrl:
    Description: SQS queue URL for 2-3 image-count requests
    Value: !Ref ImageGenerationQueueV3
  ImageGenerationQueueArn:
    Value: !GetAtt ImageGenerationQueueV3.Arn
  ImageGenerationDLQUrl:
    Description: Dead-letter queue — inspect for image jobs that failed maxReceiveCount times
    Value: !Ref ImageGenerationDLQ