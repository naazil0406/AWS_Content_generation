AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Asset Generation Service — FastAPI on Lambda behind an HTTP API, via
  Mangum. Independent stack, new resources, no dependency on
  content-generation-stack. This intentionally matches the simple,
  proven-working pattern (no raw REST API, no Web Adapter/run.sh, no
  streaming) after repeated AWS::EarlyValidation::PropertyValidation
  failures on more complex variants of this template.
  Deploy: sam build && sam deploy --guided

Globals:
  Function:
    Timeout: 210
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  KnowledgeBaseId:
    Type: String
    Description: ID of the existing Amazon Bedrock Knowledge Base. Not a URL.
  KnowledgeBaseRegion:
    Type: String
    Default: us-east-1
  ImageProvider:
    Type: String
    Default: freepik
    AllowedValues: [freepik, aws, pollinations]
  FreepikModel:
    Type: String
    Default: ""
  FreepikFilterNsfw:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  FreepikMaxConcurrentSubmissions:
    Type: Number
    Default: 1
  FreepikSubmitMaxRetries:
    Type: Number
    Default: 2
  FreepikSubmitRetryBackoffSeconds:
    Type: Number
    Default: 0.75
  FreepikPollIntervalSeconds:
    Type: Number
    Default: 3
  FreepikPollTimeoutSeconds:
    Type: Number
    Default: 170
  DeploymentPreferenceType:
    Type: String
    Default: Canary10Percent5Minutes
    AllowedValues:
      - AllAtOnce
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Canary10Percent15Minutes
      - Canary10Percent30Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
      - Linear10PercentEvery3Minutes
      - Linear10PercentEvery10Minutes

Resources:
  AssetGenerationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  GeneratedImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedImages
            Status: Enabled
            ExpirationInDays: 1

  ProdAliasErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Lambda Errors > 0 for asset_generation's "prod" alias — triggers
        CodeDeploy's automatic rollback while a canary/linear deployment
        is in progress.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref AssetGenerationFunction
        - Name: Resource
          Value: !Sub "${AssetGenerationFunction}:prod"

  AssetGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: asset_generation
      Handler: app.main.handler
      CodeUri: .
      Timeout: 210
      AutoPublishAlias: prod
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
        Alarms:
          - !Ref ProdAliasErrorAlarm
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          KNOWLEDGE_BASE_REGION: !Ref KnowledgeBaseRegion
          IMAGE_PROVIDER: !Ref ImageProvider
          FREEPIK_MODEL: !Ref FreepikModel
          FREEPIK_FILTER_NSFW: !Ref FreepikFilterNsfw
          FREEPIK_MAX_CONCURRENT_SUBMISSIONS: !Ref FreepikMaxConcurrentSubmissions
          FREEPIK_SUBMIT_MAX_RETRIES: !Ref FreepikSubmitMaxRetries
          FREEPIK_SUBMIT_RETRY_BACKOFF_SECONDS: !Ref FreepikSubmitRetryBackoffSeconds
          FREEPIK_POLL_INTERVAL: !Ref FreepikPollIntervalSeconds
          FREEPIK_POLL_TIMEOUT: !Ref FreepikPollTimeoutSeconds
          GENERATED_IMAGES_BUCKET: !Ref GeneratedImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${GeneratedImagesBucket.Arn}/*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref AssetGenerationApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref AssetGenerationApi
            Path: /
            Method: GET

Outputs:
  ApiUrl:
    Description: Invoke URL for the Asset Generation API
    Value: !Sub "https://${AssetGenerationApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Value: !GetAtt AssetGenerationFunction.Arn
  FunctionName:
    Value: !Ref AssetGenerationFunction
  ProdAliasArn:
    Value: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AssetGenerationFunction}:prod"
  GeneratedImagesBucketName:
    Value: !Ref GeneratedImagesBucket