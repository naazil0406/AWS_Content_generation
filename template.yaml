AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AI Content Generation Service — FastAPI on Lambda behind an HTTP API,
  via Mangum. Deploy with: sam build && sam deploy --guided

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  KnowledgeBaseId:
    Type: String
    Description: >
      ID of the existing Amazon Bedrock Knowledge Base (Bedrock console ->
      Knowledge Bases -> your KB -> Knowledge base overview). Not a URL.
  KnowledgeBaseRegion:
    Type: String
    Default: us-east-1
    Description: Region the Bedrock Knowledge Base lives in.
  ImageProvider:
    Type: String
    Default: freepik
    AllowedValues: [freepik, aws, pollinations]
  FreepikApiKey:
    Type: String
    NoEcho: true
    Default: ""
  UploadBucketName:
    Type: String
    Description: >
      S3 bucket containing the campaigns/ folder that feeds the Campaigns
      Data Source. Can be the same bucket the existing data source already
      uses (only the UploadPrefix folder is written to) or a separate one.
  UploadPrefix:
    Type: String
    Default: campaigns/
    Description: S3 prefix inside UploadBucketName that uploaded documents are written to.
  UploadDataSourceId:
    Type: String
    Description: >
      Data Source ID of the Campaigns Data Source (Bedrock console -> your
      Knowledge Base -> Data sources -> Campaigns). NOT the existing data
      source's ID — ingestion jobs are scoped to this ID only.

Resources:
  ContentGenerationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  GeneratedImagesBucket:
    Type: AWS::S3::Bucket
    Description: >
      Name for the S3 bucket that stores generated images. Must be
      globally unique across all AWS accounts.
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedImages
            Status: Enabled
            ExpirationInDays: 1   # presigned URLs only last S3_PRESIGNED_URL_EXPIRY seconds anyway

  ContentGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content_generation
      Handler: app.main.handler
      CodeUri: .
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          KNOWLEDGE_BASE_REGION: !Ref KnowledgeBaseRegion
          IMAGE_PROVIDER: !Ref ImageProvider
          FREEPIK_API_KEY: !Ref FreepikApiKey
          GENERATED_IMAGES_BUCKET: !Ref GeneratedImagesBucket
          UPLOAD_BUCKET_NAME: !Ref UploadBucketName
          UPLOAD_PREFIX: !Ref UploadPrefix
          UPLOAD_DATA_SOURCE_ID: !Ref UploadDataSourceId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${GeneratedImagesBucket.Arn}/*"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${UploadBucketName}/${UploadPrefix}*"
            - Effect: Allow
              Action:
                - bedrock:StartIngestionJob
                - bedrock:GetIngestionJob
              # Same Knowledge Base ARN as the bedrock:Retrieve statement above -
              # this only grants ingestion control, and start_ingestion_job() is
              # always called with UploadDataSourceId, so the existing data
              # source is never targeted even though the ARN is KB-level.
              Resource: !Sub "arn:aws:bedrock:${KnowledgeBaseRegion}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          # /{proxy+} does not match the bare root path — this catches
          # GET / so the bundled frontend/index.html is served there.
          Type: HttpApi
          Properties:
            ApiId: !Ref ContentGenerationApi
            Path: /
            Method: GET

Outputs:
  ApiUrl:
    Description: Invoke URL for the Content Generation API
    Value: !Sub "https://${ContentGenerationApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Value: !GetAtt ContentGenerationFunction.Arn
  FunctionName:
    Description: The Lambda function's actual name in AWS
    Value: !Ref ContentGenerationFunction
  GeneratedImagesBucketName:
    Description: S3 bucket storing generated images
    Value: !Ref GeneratedImagesBucket